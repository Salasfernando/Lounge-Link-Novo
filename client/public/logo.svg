<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="transparent"/>
  
  <!-- Left triangle (top-left, gold) -->
  <polygon points="60,50 200,180 60,180" fill="#C4A574"/>
  
  <!-- Right triangle (top-right, teal) -->
  <polygon points="450,50 310,180 450,180" fill="#4A7C7E"/>
  
  <!-- Center diamond (teal) -->
  <polygon points="256,140 400,280 256,360 120,280" fill="#1F4F4F"/>
  
  <!-- Left triangle (middle-left, teal) -->
  <polygon points="60,180 200,360 60,360" fill="#4A7C7E"/>
  
  <!-- Right triangle (middle-right, gold) -->
  <polygon points="450,180 310,360 450,360" fill="#C4A574"/>
  
  <!-- Bottom accent (darker center) -->
  <polygon points="200,280 256,360 310,280 256,200" fill="#0f2f2f" opacity="0.3"/>
</svg>